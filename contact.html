<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started - Safari Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Safari Digital</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="contact.html">Get Started</a>
        </nav>
    </header>

    <main class="form-container">
        <div class="form-box">
            <h2>Let's Launch Your Digital Presence</h2>
            <p>Fill out the application below, and our developer team will reach out with a customized prototype strategy proposal within 24 hours.</p>

            <form action="#" method="POST" onsubmit="alert('Thank you for choosing Safari Digital! This submission acts as a successful layout test.'); return false;">
                
                <div class="field">
                    <label for="clientName">Full Name / Company Name:</label>
                    <input type="text" id="clientName" placeholder="e.g. Jane Doe Ventures" required>
                </div>

                <div class="field">
                    <label for="clientEmail">Email Address:</label>
                    <input type="email" id="clientEmail" placeholder="yourname@domain.com" required>
                </div>

                <div class="field">
                    <label for="projectPlan">Select Desired Tier:</label>
                    <select id="projectPlan">
                        <option value="starter">Starter Plan (15,000 KSh)</option>
                        <option value="business">Business Growth Plan (35,000 KSh)</option>
                    </select>
                </div>

                <div class="field">
                    <label for="projectNotes">Project Specifications & Core Goals:</label>
                    <textarea id="projectNotes" rows="5" placeholder="Briefly describe what your business does and what functions you need your new platform to have..."></textarea>
                </div>

                <button type="submit" class="btn submit-btn">Submit Request</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Safari Digital Consultants. All Rights Reserved.</p>
    </footer>

</body>
</html>
